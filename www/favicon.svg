<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a0a3a"/>
      <stop offset="100%" stop-color="#04080f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00c8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#0066aa"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#nebula)"/>

  <!-- Subtle nebula blobs -->
  <ellipse cx="10" cy="10" rx="10" ry="8"  fill="#5010a0" opacity="0.35"/>
  <ellipse cx="24" cy="22" rx="10" ry="8"  fill="#a00850" opacity="0.25"/>
  <ellipse cx="22" cy="8"  rx="8"  ry="7"  fill="#0a1e9b" opacity="0.3"/>

  <!-- Glow halo behind cross -->
  <circle cx="16" cy="16" r="9" fill="url(#glow)" filter="url(#blur)"/>

  <!-- XMB horizontal bar -->
  <rect x="4" y="14.5" width="24" height="3" rx="1.5" fill="#00c8ff" opacity="0.9"/>

  <!-- XMB vertical tick marks (category dividers) -->
  <rect x="7"  y="12" width="1.5" height="8" rx="0.75" fill="#00c8ff" opacity="0.5"/>
  <rect x="14.25" y="11" width="1.5" height="10" rx="0.75" fill="#ffffff" opacity="0.95"/>
  <rect x="23.5" y="12" width="1.5" height="8" rx="0.75" fill="#00c8ff" opacity="0.5"/>

  <!-- Center dot (selected item) -->
  <circle cx="16" cy="16" r="3.2" fill="url(#dot)"/>
  <circle cx="16" cy="16" r="1.4" fill="#ffffff" opacity="0.9"/>

  <!-- Star sparkles -->
  <circle cx="5"  cy="5"  r="0.7" fill="#ffffff" opacity="0.8"/>
  <circle cx="27" cy="4"  r="0.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="26" cy="27" r="0.6" fill="#aaddff" opacity="0.7"/>
  <circle cx="4"  cy="26" r="0.4" fill="#ffffff" opacity="0.5"/>
  <circle cx="9"  cy="27" r="0.3" fill="#ffffff" opacity="0.6"/>
  <circle cx="28" cy="13" r="0.4" fill="#aaddff" opacity="0.5"/>
</svg>